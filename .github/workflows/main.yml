name: CI

on:
  push:
    branches: [1.0.0-beta]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Library
        run: |
          npm install
          npm run build

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ng-flowchart-dist
          path: dist/ng-flowchart
          retention-days: 1

  compat-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Angular version
          - angular-version: 14
            node-version: 18
          # Mid-range Angular version
          - angular-version: 18
            node-version: 20
          # Latest supported Angular version
          - angular-version: 21
            node-version: 22
    name: Compat (Angular ${{ matrix.angular-version }})
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: ng-flowchart-dist
          path: ng-flowchart-dist

      - name: Create Angular ${{ matrix.angular-version }} Project
        run: |
          npx -y @angular/cli@${{ matrix.angular-version }} new compat-test \
            --minimal --skip-git --skip-tests --defaults

      - name: Install Library
        working-directory: compat-test
        run: npm install ${{ github.workspace }}/ng-flowchart-dist

      - name: Add Library Import
        working-directory: compat-test
        run: |
          if [ -f src/app/app.module.ts ]; then
            # NgModule-based app (Angular 14-16)
            sed -i '1i import { NgFlowchartModule } from "@joelwenzel/ng-flowchart";' src/app/app.module.ts
            sed -i 's/imports: \[BrowserModule/imports: [BrowserModule, NgFlowchartModule/' src/app/app.module.ts
          else
            # Standalone app (Angular 17+)
            sed -i '1i import { NgFlowchartModule } from "@joelwenzel/ng-flowchart";' src/app/app.component.ts
            sed -i 's/imports: \[/imports: [NgFlowchartModule, /' src/app/app.component.ts
          fi

      - name: Build Project
        working-directory: compat-test
        run: npx ng build

  publish:
    needs: [build, compat-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: ng-flowchart-dist
          path: ng-flowchart-dist

      - name: Publish
        run: npm publish --access public
        working-directory: ng-flowchart-dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
